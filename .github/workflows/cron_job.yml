name: Daily Project Run

on:
  schedule:
    - cron: '0 */6 * * *' # Yeh ab har 6 ghante me automatic run hoga (0:00, 6:00, 12:00, 18:00 UTC)

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        run: python app.py

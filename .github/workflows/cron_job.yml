name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante me run hoga
  workflow_dispatch: # Isse aap button click karke manually bhi test kar sakte hain

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request to Streamlit App
        run: |
          curl -I https://visionary-analytics-ai.streamlit.app/
